<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82FF"/>
      <stop offset=".55" stop-color="#5B5CFF"/>
      <stop offset="1" stop-color="#8B4DFF"/>
    </linearGradient>
    <radialGradient id="glow" cx=".28" cy=".2" r=".75">
      <stop offset="0" stop-color="#7DE3FF" stop-opacity=".75"/>
      <stop offset=".6" stop-color="#7DE3FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4ECFF"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset=".5" stop-color="#E3348F"/>
      <stop offset="1" stop-color="#F5C400"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1B1464" flood-opacity=".35"/>
    </filter>
  </defs>
  <!-- squircle tile -->
  <rect x="40" y="40" width="944" height="944" rx="232" fill="url(#bg)"/>
  <rect x="40" y="40" width="944" height="944" rx="232" fill="url(#glow)"/>
  <rect x="40" y="40" width="944" height="944" rx="232" fill="url(#sheen)"/>
  <rect x="42" y="42" width="940" height="940" rx="230" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="4"/>
  <!-- reset arc with arrowhead -->
  <g filter="url(#sh)" fill="none" stroke="#fff" stroke-width="58" stroke-linecap="round">
    <path d="M 742 404 A 252 252 0 1 0 760 578" stroke-opacity=".95"/>
  </g>
  <path d="M 790 300 L 776 452 L 640 400 Z" fill="#fff" stroke="#fff" stroke-width="24" stroke-linejoin="round" filter="url(#sh)"/>
  <!-- ink drop -->
  <g filter="url(#sh)">
    <path d="M512 318 C 512 318 640 462 640 560 A 128 128 0 0 1 384 560 C 384 462 512 318 512 318 Z" fill="url(#drop)"/>
  </g>
  <path d="M512 430 C 512 430 586 516 586 568 A 74 74 0 0 1 438 568 C 438 516 512 430 512 430 Z" fill="url(#ink)" opacity=".95"/>
  <ellipse cx="478" cy="548" rx="14" ry="30" fill="#fff" opacity=".8" transform="rotate(18 478 548)"/>
</svg>
